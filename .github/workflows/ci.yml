name: Reliability checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, integration and adversarial tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Deterministic fixture evaluation
        run: PYTHONPATH=src python -m pipeline_watchdog evaluate
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Check frontend syntax
        run: node --check src/pipeline_watchdog/static/app.js
      - name: Install and exercise console entrypoint
        run: |
          python -m pip install .
          pipeline-watchdog --help
  cloud-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned cloud dependencies
        run: python -m pip install -r requirements-cloud.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Validate cloud imports without credentials
        run: PYTHONPATH=src python -c 'from google.cloud import storage; from pipeline_watchdog.cloud import CloudDashboard'
      - name: Build non-root image without publishing
        run: docker build -t watchdog-ci .
      - name: Exercise installed image offline
        run: docker run --rm --entrypoint python watchdog-ci -m pipeline_watchdog evaluate
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Check format
        run: terraform -chdir=infra/gcp fmt -check -recursive
      - name: Initialize provider without cloud backend
        run: terraform -chdir=infra/gcp init -backend=false -input=false
      - name: Validate provider schema
        run: terraform -chdir=infra/gcp validate
      - name: Mocked safety plans, no cloud credentials
        run: terraform -chdir=infra/gcp test

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install advisory checker
        run: python -m pip install pip-audit
      - name: Audit pinned cloud dependency versions
        run: python -m pip_audit --disable-pip --no-deps -r requirements-cloud.txt
