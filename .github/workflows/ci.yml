name: Reliability checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, integration and adversarial tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Deterministic fixture evaluation
        run: PYTHONPATH=src python -m pipeline_watchdog evaluate
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Check frontend syntax
        run: node --check src/pipeline_watchdog/static/app.js
      - name: Install and exercise console entrypoint
        run: |
          python -m pip install .
          pipeline-watchdog --help
