[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pipeline-watchdog"
version = "0.2.0"
description = "A local-first data reliability watchdog with evidence-grounded AI triage."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AI Pipeline Watchdog contributors"}]
dependencies = []

[project.scripts]
pipeline-watchdog = "pipeline_watchdog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipeline_watchdog = ["static/*"]
